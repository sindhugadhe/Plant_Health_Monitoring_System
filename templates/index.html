<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" />
    <title>Classification</title>
    <style>
        body {
            min-height: 100vh; /* Full height of the viewport */
            margin: 0; /* Remove default body margin */
            background-image: url("{{url_for('static', filename='uploading.jpg') }}");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }
.menu-container {
    position: relative;
    display: inline-block;
}

.menu-button {
    padding: 10px 20px;
    background-color: #00ff9922;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.menu-links {
    display: none;
    position: absolute;
    background-color: white;
    min-width: 160px;
    border: 1px solid #ccc;
    z-index: 1;
}

.menu-container:hover .menu-links {
    display: block;
}

.menu-links a {
    color: black;
    padding: 12px 16px;
    display: block;
    text-decoration: none;
}

.menu-links a:hover {
    background-color: #f1f1f1;
}
    </style>
</head>
<body>
    <div class="wrap">
        <header id="header">
            <div class="container-fluid">
            <div class="col-md-12">
                <div class="menu-container">
                    <button class="menu-button">Menu</button>
                    <div class="menu-links">
                        <a href="{{ url_for('logout') }}">Logout</a>
                    </div>
                </div>
            </div>
        </div>    
        </header>
    </div>

    <div id="maintext" style="position: absolute; margin: auto; width: 700px; height: 200px; text-align: center; top: 0; bottom: 0; left: 0; right: 0;">
        <h1 class="text-light mb-2">Upload your image to be classified!</h1>
        <h4 class="text-light mb-5">(Please upload images less than 500kb in size)</h4>
        <form enctype="multipart/form-data" action="/predict2" method="post">
            <p class="text-dark">
                <input type="file" name="file" />
                <input type="submit" value="Upload" />
            </p>
        </form>
    </div>

    <!-- JS Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <!-- <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script> -->

    <script src="static/assets/js/vendor/bootstrap.min.js"></script>
</body>
</html>
